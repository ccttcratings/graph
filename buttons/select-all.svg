<svg xmlns="http://www.w3.org/2000/svg" width="160" height="70" viewBox="0 0 160 70">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf8ea"/>
      <stop offset="100%" stop-color="#c5eec5"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2f2e2"/>
      <stop offset="100%" stop-color="#c5eec5"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aaa7a"/>
      <stop offset="100%" stop-color="#5a8a5a"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8aba8a"/>
      <stop offset="100%" stop-color="#6a9a6a"/>
    </linearGradient>
  </defs>
  <!-- Outer thick border -->
  <rect x="1" y="1" width="158" height="68" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Top bevel face -->
  <polygon points="4,4 156,4 148,12 12,12" fill="url(#gTop)"/>
  <!-- Bottom bevel face -->
  <polygon points="12,58 148,58 156,66 4,66" fill="url(#gBottom)"/>
  <!-- Left bevel face -->
  <polygon points="4,4 12,12 12,58 4,66" fill="url(#gLeft)"/>
  <!-- Right bevel face -->
  <polygon points="156,4 148,12 148,58 156,66" fill="url(#gRight)"/>
  <!-- Inner thin border -->
  <rect x="12" y="12" width="136" height="46" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Center fill -->
  <rect x="13" y="13" width="134" height="44" fill="#c5eec5"/>
  <!-- Text two lines -->
  <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#000">Select</text>
  <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#000">All</text>
</svg>
