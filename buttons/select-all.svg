<svg xmlns="http://www.w3.org/2000/svg" width="220" height="70" viewBox="0 0 220 70">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8e8"/>
      <stop offset="100%" stop-color="#c5eec5"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f5e0"/>
      <stop offset="100%" stop-color="#c5eec5"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80b880"/>
      <stop offset="100%" stop-color="#5a8a5a"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90c890"/>
      <stop offset="100%" stop-color="#6a9a6a"/>
    </linearGradient>
  </defs>
  <!-- Outer border -->
  <rect x="1" y="1" width="218" height="68" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Top bevel -->
  <polygon points="3,3 217,3 209,11 11,11" fill="url(#gTop)" stroke="#000" stroke-width="1"/>
  <!-- Bottom bevel -->
  <polygon points="11,59 209,59 217,67 3,67" fill="url(#gBottom)" stroke="#000" stroke-width="1"/>
  <!-- Left bevel -->
  <polygon points="3,3 11,11 11,59 3,67" fill="url(#gLeft)" stroke="#000" stroke-width="1"/>
  <!-- Right bevel -->
  <polygon points="217,3 209,11 209,59 217,67" fill="url(#gRight)" stroke="#000" stroke-width="1"/>
  <!-- Center fill -->
  <rect x="11" y="11" width="198" height="48" fill="#c5eec5" stroke="#000" stroke-width="1"/>
  <!-- Text -->
  <text x="110" y="40" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000">Select All</text>
</svg>
