<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CCTTC Ratings Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#f7f8fa;color:#1b1f23}
#app{display:flex;flex-direction:column;height:100vh}
#body{display:flex;flex:1;overflow:hidden}
#sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid #e1e4e8;display:flex;flex-direction:column;overflow:hidden}
#sidebarHeader{padding:12px 6px 8px;border-bottom:1px solid #e1e4e8;background:#fdf1e5}
#logo{display:block;width:100%;max-height:140px;object-fit:contain;margin:0 0 12px;border-radius:6px}
.toolbar{display:flex;gap:4px;margin-bottom:6px}
.toolbar img{width:100%;height:auto;cursor:pointer;display:block;transition:filter .2s}
.toolbar img:hover{filter:brightness(.92) saturate(1.5)}
.toolbar img.touch-active{filter:brightness(.88) saturate(1.8)}
#count{font-size:12px;color:#6a737d;margin-bottom:4px}
#names{flex:1;overflow-y:auto;padding:4px 0}
.player-row{display:flex;align-items:center;padding:4px 14px;cursor:pointer;transition:background .15s;gap:8px}
.player-row.active{background:#fce5cd}
.player-row.off{background:#fdf1e5;opacity:.38}
.swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.pname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-row.active .pname{font-weight:800}
#chartWrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#fce5cd}
#chartBox{position:relative;width:100%;flex:1;padding:10px;overflow:hidden}
canvas{width:100%!important;height:100%!important}
#scrollbar{position:relative;height:24px;background:#e1e4e8;border-top:1px solid #d1d5da;flex-shrink:0;cursor:pointer}
#scrollTrack{position:absolute;top:4px;left:8px;right:8px;height:16px;background:#d1d5da;border-radius:8px}
#scrollThumb{position:absolute;top:0;height:16px;background:#6a737d;border-radius:8px;cursor:grab;min-width:24px;transition:none}
#scrollThumb:active{cursor:grabbing;background:#555}
#loading{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.85);z-index:10;font-size:16px;color:#6a737d}
#loading .spinner{width:24px;height:24px;border:3px solid #e1e4e8;border-top-color:#0366d6;border-radius:50%;animation:spin .6s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;background:#ffa5a5;color:#1b1f23;padding:12px 20px;text-align:center;font-size:14px}
#zoomHint{position:absolute;bottom:32px;right:16px;font-size:11px;color:#6a737d;pointer-events:none;opacity:.7}
</style>
</head>

<script>
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQX7guKy-_ONzc6nuCWGLu2UmfLRb5CvD60e8s035PNeGNqz5L2_NtZ00fbmq0eb8HOhgSryIpbVYz-/pub?gid=795365907&single=true&output=csv';
var LS_KEY = 'ttRatingsGraphHidden_v2';
var FADE_START = 30;
var FADE_END = 141;
var HIDE_DAY = 142;
var GOLDEN_ANGLE = 137.508;
var CLICK_TOL = 30;
var DRAG_TOL = 8;
var DEFAULT_RADIUS = 2;
var MIN_SPAN = 86400000 * 7;

var view = { min: 0, max: 0, dataMin: 0, dataMax: 0 };
var pan = { active: false, startX: 0, startViewMin: 0, startViewMax: 0, didDrag: false };
var pinch = { active: false, lastDist: 0, startViewMin: 0, startViewMax: 0 };
var thumbDrag = { active: false, startX: 0, startViewMin: 0, startViewMax: 0 };

function distToSegmentSq(px, py, ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  var len2 = dx * dx + dy * dy;
  if (len2 === 0) return (px - ax) * (px - ax) + (py - ay) * (py - ay);
  var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  var cx = ax + t * dx, cy = ay + t * dy;
  return (px - cx) * (px - cx) + (py - cy) * (py - cy);
}

function graphColor(i) {
  var h = (i * GOLDEN_ANGLE) % 360;
  if (h >= 45 && h < 65) return 'hsl(35,72%,35%)';
  if (h >= 20 && h < 45) return 'hsl(25,72%,25%)';
  if (h >= 65 && h < 105) return 'hsl(145,65%,32%)';
  return 'hsl(' + h + ',72%,60%)';
}

function parseDate(s) {
  s = s.trim().replace(/^"|"$/g, '');
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function getFadeColor(daysInactive) {
  if (daysInactive >= 30 && daysInactive <= 43) return '#5e554c';
  if (daysInactive >= 44 && daysInactive <= 57) return '#807468';
  if (daysInactive >= 58 && daysInactive <= 71) return '#9a8c7d';
  if (daysInactive >= 72 && daysInactive <= 85) return '#af9f8e';
  if (daysInactive >= 86 && daysInactive <= 99) return '#c1b09d';
  if (daysInactive >= 100 && daysInactive <= 113) return '#d2bfab';
  if (daysInactive >= 114 && daysInactive <= 127) return '#e1cdb7';
  if (daysInactive >= 128 && daysInactive <= 141) return '#efd9c2';
  return null;
}

function parseCSV(text) {
  var lines = text.split('\n');
  var series = {};
  var playerDates = {};
  for (var i = 1; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var match = line.match(/^([^,]+),"?([^"]+)"?,(.+)$/);
    if (!match) continue;
    var player = match[1].trim();
    var date = parseDate(match[2]);
    var rating = parseFloat(match[3]);
    if (!player || !date || isNaN(rating)) continue;
    if (!series[player]) { series[player] = []; playerDates[player] = date; }
    series[player].push([date, rating]);
    if (date > playerDates[player]) playerDates[player] = date;
  }
  for (var p in series) {
    series[p].sort(function(a, b) { return a[0].getTime() - b[0].getTime(); });
  }
  var lastRating = {};
  for (var p in series) {
    var pts = series[p];
    lastRating[p] = pts[pts.length - 1][1];
  }
  var roster = Object.keys(series).sort(function(a, b) {
    return lastRating[b] - lastRating[a];
  });
  return { roster: roster, series: series, lastDates: playerDates };
}

var state = {
  hidden: {},
  chart: null,
  active: null,
  roster: [],
  series: {},
  colors: {}
};

function loadHidden() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(function(n) { state.hidden[n] = true; });
        return true;
      }
    }
  } catch(e) {}
  return false;
}

function saveHidden() {
  var arr = [];
  for (var n in state.hidden) { if (state.hidden[n]) arr.push(n); }
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
}

function isPlayerActive(name) {
  if (state.hidden[name]) return false;
  var dates = state.series[name];
  if (!dates || dates.length === 0) return false;
  var lastMs = dates[dates.length - 1][0].getTime();
  var now = Date.now();
  var days = Math.floor((now - lastMs) / 86400000);
  return days < FADE_START;
}

function buildSidebar() {
  var container = document.getElementById('names');
  container.innerHTML = '';
  var shown = 0;
  state.roster.forEach(function(name) {
    var dates = state.series[name];
    var lastMs = dates[dates.length - 1][0].getTime();
    var days = Math.floor((Date.now() - lastMs) / 86400000);
    var fade = getFadeColor(days);
    var hidden = state.hidden[name];
    var row = document.createElement('div');
    row.className = 'player-row' + (hidden ? ' off' : ' active');
    var swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = state.colors[name];
    var pname = document.createElement('div');
    pname.className = 'pname';
    pname.textContent = name;
    if (fade) pname.style.color = fade;
    row.appendChild(swatch);
    row.appendChild(pname);
    row.addEventListener('click', function() {
      state.hidden[name] = !state.hidden[name];
      saveHidden();
      updateChart();
      buildSidebar();
    });
    container.appendChild(row);
    if (!hidden) shown++;
  });
  document.getElementById('count').textContent = shown + ' of ' + state.roster.length + ' shown';
}

function clampView() {
  var span = view.max - view.min;
  if (span < MIN_SPAN) span = MIN_SPAN;
  if (view.min < view.dataMin) { view.min = view.dataMin; view.max = view.min + span; }
  if (view.max > view.dataMax) { view.max = view.dataMax; view.min = view.max - span; }
  if (view.min < view.dataMin) view.min = view.dataMin;
  if (view.max > view.dataMax) view.max = view.dataMax;
}

function applyView() {
  var chart = state.chart;
  if (!chart) return;
  chart.options.scales.x.min = view.min;
  chart.options.scales.x.max = view.max;
  chart.update('none');
  cropAxis();
  updateScrollThumb();
}

function cropAxis() {
  var chart = state.chart;
  if (!chart) return;
  var min = Infinity, max = -Infinity;
  chart.data.datasets.forEach(function(ds) {
    if (ds.hidden) return;
    ds.data.forEach(function(pt) {
      if (pt.x >= view.min && pt.x <= view.max) {
        if (pt.y < min) min = pt.y;
        if (pt.y > max) max = pt.y;
      }
    });
  });
  if (min === Infinity) { min = 800; max = 1200; }
  var pad = Math.max((max - min) * 0.08, 10);
  min = Math.floor((min - pad) / 10) * 10;
  max = Math.ceil((max + pad) / 10) * 10;
  chart.options.scales.y.min = min;
  chart.options.scales.y.max = max;
  chart.update('none');
}

function updateScrollThumb() {
  var thumb = document.getElementById('scrollThumb');
  var track = document.getElementById('scrollTrack');
  if (!thumb || !track) return;
  var totalSpan = view.dataMax - view.dataMin;
  if (totalSpan <= 0) return;
  var trackW = track.clientWidth;
  var viewSpan = view.max - view.min;
  var ratio = viewSpan / totalSpan;
  var thumbW = Math.max(24, ratio * trackW);
  var pos = ((view.min - view.dataMin) / totalSpan) * (trackW - thumbW);
  thumb.style.width = thumbW + 'px';
  thumb.style.left = pos + 'px';
}

var customXAxis = {
  id: 'customXAxis',
  beforeDatasetsDraw: function(chart) {
    var ctx = chart.ctx;
    var area = chart.chartArea;
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(area.left, area.top, area.right - area.left, area.bottom - area.top);
    var xScale = chart.scales.x;
    var ticks = xScale.ticks || [];
    var years = {};
    ticks.forEach(function(t) {
      var d = new Date(t.value);
      var y = d.getFullYear();
      if (!years[y]) years[y] = { min: t.value, max: t.value };
      else { years[y].min = Math.min(years[y].min, t.value); years[y].max = Math.max(years[y].max, t.value); }
    });
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 2;
    Object.keys(years).forEach(function(y) {
      if (parseInt(y) === Object.keys(years).sort()[0]) return;
      var x = xScale.getPixelForValue(years[y].min);
      ctx.beginPath();
      ctx.moveTo(x, area.top);
      ctx.lineTo(x, area.bottom);
      ctx.stroke();
    });
    ctx.restore();
  },
  afterDatasetsDraw: function(chart) {
    var ctx = chart.ctx;
    var area = chart.chartArea;
    var xScale = chart.scales.x;
    if (!area || !xScale) return;
    var ticks = xScale.ticks || [];
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 11px -apple-system,sans-serif';
    ctx.fillStyle = '#6a737d';
    for (var i = 0; i < ticks.length; i++) {
      var px0 = xScale.getPixelForValue(ticks[i].value);
      var px1 = i + 1 < ticks.length
        ? xScale.getPixelForValue(ticks[i + 1].value)
        : (i > 0 ? px0 + (px0 - xScale.getPixelForValue(ticks[i - 1].value)) : px0 + 60);
      var mid = (px0 + px1) / 2;
      if (mid < area.left || mid > area.right) continue;
      if (px1 - px0 < 45) continue;
      ctx.fillText(MON[new Date(ticks[i].value).getMonth()], mid, area.bottom + 9);
    }
    var years = [];
    for (var k = 0; k < ticks.length; k++) {
      var y = new Date(ticks[k].value).getFullYear();
      if (years.indexOf(y) === -1) years.push(y);
    }
    ctx.font = 'bold 13px -apple-system,sans-serif';
    ctx.fillStyle = '#24292f';
    for (var m = 0; m < years.length; m++) {
      var s0 = Math.max(xScale.min, new Date(years[m], 0, 1).getTime());
      var s1 = Math.min(xScale.max, new Date(years[m] + 1, 0, 1).getTime());
      var xm = (xScale.getPixelForValue(s0) + xScale.getPixelForValue(s1)) / 2;
      ctx.fillText(String(years[m]), xm, area.bottom + 24);
    }
    ctx.restore();
  }
};

function buildChart() {
  var datasets = [];
  state.roster.forEach(function(name, i) {
    var pts = state.series[name].map(function(r) { return { x: r[0], y: r[1] }; });
    datasets.push({
      label: name,
      data: pts,
      borderColor: state.colors[name],
      backgroundColor: state.colors[name],
      borderWidth: function(ctx) {
        return state.active && ctx.datasetIndex === state.active.di ? 4 : 1.5;
      },
      pointRadius: function(ctx) {
        return state.active && ctx.datasetIndex === state.active.di && ctx.dataIndex === state.active.idx ? 7 : DEFAULT_RADIUS;
      },
      pointHoverRadius: 5,
      pointHoverBorderWidth: 2,
      tension: 0.05,
      spanGaps: false,
      hidden: !!state.hidden[name]
    });
  });
  var ctx = document.getElementById('chart').getContext('2d');
  state.chart = new Chart(ctx, {
    type: 'line',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { bottom: 40 } },
      events: [],
      animation: false,
      hover: { mode: null },
      interaction: { mode: null },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          callbacks: {
            title: function(items) { return items[0].dataset.label; },
            label: function(item) {
              var d = new Date(item.parsed.x);
              var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
              var ds = months[d.getMonth()] + ' ' + d.getDate() + ', ' + String(d.getFullYear()).slice(2);
              var v = item.parsed.y;
              var vs = v === Math.floor(v) ? String(v) : v.toFixed(1);
              return ds + '  \u00b7  ' + vs;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month' },
          grid: { color: 'rgba(0,0,0,0.08)' },
          border: { display: false },
          ticks: { display: false }
        },
        y: {
          type: 'linear',
          grid: { color: 'rgba(0,0,0,0.08)' },
          border: { display: false },
          ticks: { font: { weight: 'bold' } },
          title: { display: true, text: 'Rating', font: { size: 14, weight: 'bold' } }
        }
      }
    },
    plugins: [customXAxis]
  });
}

function onCanvasClick(evt) {
  var chart = state.chart;
  if (!chart) return;
  var rect = chart.canvas.getBoundingClientRect();
  var clickX = evt.clientX - rect.left;
  var clickY = evt.clientY - rect.top;
  var bestDi = -1, bestIdx = -1, bestLineDist = Infinity;
  for (var di = 0; di < chart.data.datasets.length; di++) {
    var ds = chart.data.datasets[di];
    if (ds.hidden) continue;
    var els = chart.getDatasetMeta(di).data;
    if (!els.length) continue;
    var lineDist = Infinity, nodeDist = Infinity, nodeIdx = -1;
    for (var j = 0; j < els.length; j++) {
      var el = els[j];
      if (el.skip) continue;
      var px = el.x, py = el.y;
      var dNode = (clickX - px) * (clickX - px) + (clickY - py) * (clickY - py);
      if (dNode < nodeDist) { nodeDist = dNode; nodeIdx = j; }
      if (j > 0) {
        var prev = els[j - 1];
        if (prev.skip) continue;
        var dSeg = distToSegmentSq(clickX, clickY, prev.x, prev.y, px, py);
        if (dSeg < lineDist) lineDist = dSeg;
      } else {
        if (dNode < lineDist) lineDist = dNode;
      }
    }
    if (lineDist < bestLineDist) { bestLineDist = lineDist; bestDi = di; bestIdx = nodeIdx; }
  }
  if (bestDi === -1 || bestLineDist > CLICK_TOL * CLICK_TOL) {
    if (state.active) {
      state.active = null;
      chart.tooltip.setActiveElements([]);
      chart.update();
    }
    return;
  }
  state.active = { di: bestDi, idx: bestIdx };
  chart.tooltip.setActiveElements([{ datasetIndex: bestDi, index: bestIdx }], { x: clickX, y: clickY });
  chart.update();
}

function clearTooltip() {
  if (!state.chart) return;
  state.active = null;
  state.chart.tooltip.setActiveElements([]);
  state.chart.update();
}

function canvasPointerDown(evt) {
  if (evt.pointerType === 'touch') return;
  pan.active = true;
  pan.startX = evt.clientX;
  pan.startViewMin = view.min;
  pan.startViewMax = view.max;
  pan.didDrag = false;
}

function canvasPointerMove(evt) {
  if (!pan.active || evt.pointerType === 'touch') return;
  var dx = evt.clientX - pan.startX;
  if (Math.abs(dx) > DRAG_TOL) pan.didDrag = true;
  if (!pan.didDrag) return;
  var chart = state.chart;
  if (!chart) return;
  var area = chart.chartArea;
  var pxPerMs = (area.right - area.left) / (pan.startViewMax - pan.startViewMin);
  var msDelta = -dx / pxPerMs;
  view.min = pan.startViewMin + msDelta;
  view.max = pan.startViewMax + msDelta;
  clampView();
  applyView();
}

function canvasPointerUp(evt) {
  if (evt.pointerType === 'touch') return;
  var wasDrag = pan.didDrag;
  pan.active = false;
  pan.didDrag = false;
  if (!wasDrag) onCanvasClick(evt);
}

function canvasTouchStart(evt) {
  if (evt.touches.length === 2) {
    evt.preventDefault();
    pinch.active = true;
    pinch.startViewMin = view.min;
    pinch.startViewMax = view.max;
    var dx = evt.touches[0].clientX - evt.touches[1].clientX;
    var dy = evt.touches[0].clientY - evt.touches[1].clientY;
    pinch.lastDist = Math.sqrt(dx * dx + dy * dy);
    pan.active = false;
  } else if (evt.touches.length === 1) {
    pan.active = true;
    pan.startX = evt.touches[0].clientX;
    pan.startViewMin = view.min;
    pan.startViewMax = view.max;
    pan.didDrag = false;
  }
}

function canvasTouchMove(evt) {
  if (evt.touches.length === 2 && pinch.active) {
    evt.preventDefault();
    var dx = evt.touches[0].clientX - evt.touches[1].clientX;
    var dy = evt.touches[0].clientY - evt.touches[1].clientY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (pinch.lastDist > 0) {
      var scale = pinch.lastDist / dist;
      var span = (pinch.startViewMax - pinch.startViewMin) * scale;
      span = Math.max(MIN_SPAN, Math.min(view.dataMax - view.dataMin, span));
      var center = (pinch.startViewMin + pinch.startViewMax) / 2;
      view.min = center - span / 2;
      view.max = center + span / 2;
      clampView();
      applyView();
    }
    pinch.lastDist = dist;
  } else if (evt.touches.length === 1 && pan.active && !pinch.active) {
    var dx2 = evt.touches[0].clientX - pan.startX;
    if (Math.abs(dx2) > DRAG_TOL) pan.didDrag = true;
    if (!pan.didDrag) return;
    var chart = state.chart;
    if (!chart) return;
    var area = chart.chartArea;
    var pxPerMs = (area.right - area.left) / (pan.startViewMax - pan.startViewMin);
    var msDelta = -dx2 / pxPerMs;
    view.min = pan.startViewMin + msDelta;
    view.max = pan.startViewMax + msDelta;
    clampView();
    applyView();
  }
}

function canvasTouchEnd(evt) {
  if (evt.touches.length < 2) {
    pinch.active = false;
    pinch.lastDist = 0;
  }
  if (evt.touches.length === 0) {
    var wasDrag = pan.didDrag;
    pan.active = false;
    pan.didDrag = false;
    if (!wasDrag && evt.changedTouches && evt.changedTouches.length === 1) {
      var t = evt.changedTouches[0];
      onCanvasClick({ clientX: t.clientX, clientY: t.clientY });
    }
  }
}

function canvasWheel(evt) {
  evt.preventDefault();
  var chart = state.chart;
  if (!chart) return;
  var rect = chart.canvas.getBoundingClientRect();
  var mouseX = evt.clientX - rect.left;
  var area = chart.chartArea;
  var mouseRatio = Math.max(0, Math.min(1, (mouseX - area.left) / (area.right - area.left)));
  var span = view.max - view.min;
  var zoomFactor = evt.deltaY > 0 ? 1.15 : 1 / 1.15;
  var newSpan = Math.max(MIN_SPAN, Math.min(view.dataMax - view.dataMin, span * zoomFactor));
  var mouseMs = view.min + span * mouseRatio;
  view.min = mouseMs - newSpan * mouseRatio;
  view.max = mouseMs + newSpan * (1 - mouseRatio);
  clampView();
  applyView();
}

var scrollbarEl, trackEl, thumbEl;

function initScrollbar() {
  scrollbarEl = document.getElementById('scrollbar');
  trackEl = document.getElementById('scrollTrack');
  thumbEl = document.getElementById('scrollThumb');
  if (!thumbEl || !trackEl) return;

  thumbEl.addEventListener('mousedown', function(evt) {
    evt.preventDefault();
    thumbDrag.active = true;
    thumbDrag.startX = evt.clientX;
    thumbDrag.startViewMin = view.min;
    thumbDrag.startViewMax = view.max;
    document.body.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', function(evt) {
    if (!thumbDrag.active) return;
    var trackW = trackEl.clientWidth;
    var totalSpan = view.dataMax - view.dataMin;
    var dx = evt.clientX - thumbDrag.startX;
    var msDelta = (dx / trackW) * totalSpan;
    view.min = thumbDrag.startViewMin + msDelta;
    view.max = thumbDrag.startViewMax + msDelta;
    clampView();
    applyView();
  });
  document.addEventListener('mouseup', function() {
    thumbDrag.active = false;
    document.body.style.cursor = '';
  });

  scrollbarEl.addEventListener('click', function(evt) {
    if (evt.target === thumbEl) return;
    var rect = trackEl.getBoundingClientRect();
    var clickRatio = (evt.clientX - rect.left) / rect.width;
    var span = view.max - view.min;
    var center = view.dataMin + clickRatio * (view.dataMax - view.dataMin);
    view.min = center - span / 2;
    view.max = center + span / 2;
    clampView();
    applyView();
  });

  thumbEl.addEventListener('touchstart', function(evt) {
    if (evt.touches.length !== 1) return;
    evt.preventDefault();
    thumbDrag.active = true;
    thumbDrag.startX = evt.touches[0].clientX;
    thumbDrag.startViewMin = view.min;
    thumbDrag.startViewMax = view.max;
  }, { passive: false });
  document.addEventListener('touchmove', function(evt) {
    if (!thumbDrag.active || evt.touches.length !== 1) return;
    var trackW = trackEl.clientWidth;
    var totalSpan = view.dataMax - view.dataMin;
    var dx = evt.touches[0].clientX - thumbDrag.startX;
    var msDelta = (dx / trackW) * totalSpan;
    view.min = thumbDrag.startViewMin + msDelta;
    view.max = thumbDrag.startViewMax + msDelta;
    clampView();
    applyView();
  }, { passive: true });
  document.addEventListener('touchend', function() {
    thumbDrag.active = false;
  });
}

function init() {
  var hadChoice = loadHidden();
  fetch(CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(csv) {
      var data = parseCSV(csv);
      var activeRoster = [];
      var activeSeries = {};
      var now = Date.now();
      data.roster.forEach(function(name) {
        var dates = data.series[name];
        if (!dates || dates.length === 0) return;
        var lastMs = dates[dates.length - 1][0].getTime();
        var days = Math.floor((now - lastMs) / 86400000);
        if (days < HIDE_DAY) {
          activeRoster.push(name);
          activeSeries[name] = dates;
        }
      });
      state.roster = activeRoster;
      state.series = activeSeries;
      state.colors = {};
      state.roster.forEach(function(name, i) { state.colors[name] = graphColor(i); });
      state.roster.forEach(function(name) {
        if (name.toLowerCase().indexOf('kevin krandall') !== -1) state.colors[name] = 'hsl(140,72%,30%)';
      });
      state.hidden = {};
      activeRoster.forEach(function(name) {
        var dates = activeSeries[name];
        var lastMs = dates[dates.length - 1][0].getTime();
        var days = Math.floor((now - lastMs) / 86400000);
        if (days >= FADE_START) state.hidden[name] = true;
      });
      saveHidden();

      var allDates = [];
      activeRoster.forEach(function(name) {
        activeSeries[name].forEach(function(r) { allDates.push(r[0].getTime()); });
      });
      if (allDates.length === 0) return;
      view.dataMin = Math.min.apply(null, allDates);
      view.dataMax = Math.max.apply(null, allDates);
      var span = view.dataMax - view.dataMin;
      view.min = view.dataMax - span * 0.3;
      view.max = view.dataMax;

      document.getElementById('loading').style.display = 'none';
      buildSidebar();
      buildChart();
      clampView();
      applyView();
      initScrollbar();

      var canvas = state.chart.canvas;
      canvas.addEventListener('mousedown', canvasPointerDown);
      canvas.addEventListener('mousemove', canvasPointerMove);
      canvas.addEventListener('mouseup', canvasPointerUp);
      canvas.addEventListener('mouseleave', function() { pan.active = false; pan.didDrag = false; });
      canvas.addEventListener('touchstart', canvasTouchStart, { passive: false });
      canvas.addEventListener('touchmove', canvasTouchMove, { passive: false });
      canvas.addEventListener('touchend', canvasTouchEnd);
      canvas.addEventListener('wheel', canvasWheel, { passive: false });
    })
    .catch(function(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'Failed to load data: ' + err.message;
    });
}

document.getElementById('showAll').addEventListener('click', function() {
  state.hidden = {};
  saveHidden();
  updateChart();
  buildSidebar();
});

document.getElementById('hideAll').addEventListener('click', function() {
  state.roster.forEach(function(n) { state.hidden[n] = true; });
  saveHidden();
  updateChart();
  buildSidebar();
});

document.getElementById('hideInactive').addEventListener('click', function() {
  state.hidden = {};
  state.roster.forEach(function(n) {
    if (!isPlayerActive(n)) state.hidden[n] = true;
  });
  saveHidden();
  updateChart();
  buildSidebar();
});

function updateChart() {
  if (!state.chart) return;
  clearTooltip();
  state.chart.data.datasets.forEach(function(ds) {
    ds.hidden = !!state.hidden[ds.label];
  });
  applyView();
}

document.querySelectorAll('.toolbar img').forEach(function(img) {
  img.addEventListener('pointerdown', function() {
    this.classList.add('touch-active');
    var el = this;
    setTimeout(function() { el.classList.remove('touch-active'); }, 300);
  });
});

var watchdog = setTimeout(function() {
  document.getElementById('loading').innerHTML = '<div style="text-align:center">Loading took too long. Please refresh the page.</div>';
}, 40000);

init();
clearTimeout(watchdog);
</script>
